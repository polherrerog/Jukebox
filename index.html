<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interfaz de reproductor musical House Station" />
    <title>House Station</title>
    <script src="/path/to/howler.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="svg-definitions" aria-hidden="true">
      <symbol id="icon-back" viewBox="0 0 24 24">
        <path d="M19 20 9 12l10-8v16ZM5 5v14" />
      </symbol>
      <symbol id="icon-forward" viewBox="0 0 24 24">
        <path d="m5 4 10 8-10 8V4Zm14 1v14" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7V5Z" />
      </symbol>
      <symbol id="icon-volume" viewBox="0 0 24 24">
        <path d="M5 10v4h3l4 4V6L8 10H5Zm11-1.5a5 5 0 0 1 0 7m2.5-9.5a8.5 8.5 0 0 1 0 12" />
      </symbol>
      <symbol id="icon-equalizer" viewBox="0 0 24 24">
        <path d="M5 5v14m7-14v14m7-14v14M3 9h4m3 6h4m3-7h4" />
      </symbol>
    </svg>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="House Station, inicio">
          <span class="brand-mark"><span></span></span>
          HOUSE STATION
        </a>
        <div class="session-label">
          <span class="live-dot"></span>
          EN PAUSA
        </div>
        <span class="header-spacer" aria-hidden="true"></span>
      </header>

      <section class="workspace">
        <div class="player-column">
          <p class="eyebrow">AHORA SUENA</p>
          <article class="hero-player">
            <img
              class="hero-cover"
              src="https://images.unsplash.com/photo-1761882725885-d3d8bd2032d1?auto=format&fit=crop&w=900&q=85"
              alt="Portada de After Hours"
            />
            <div class="hero-copy">
              <div class="track-index">01 <span>/</span> 07</div>
              <div>
                <p class="album-label">AFTER HOURS</p>
                <h1>Midnight Drive</h1>
                <p class="artist">Nova Reyes</p>
              </div>
            </div>

            <div class="player-controls">
              <div class="transport">
                <button type="button" aria-label="Canción anterior">
                  <svg aria-hidden="true"><use href="#icon-back"></use></svg>
                </button>
                <button class="play-button" type="button" aria-label="Reproducir">
                  <svg aria-hidden="true"><use href="#icon-play"></use></svg>
                </button>
                <button type="button" aria-label="Canción siguiente">
                  <svg aria-hidden="true"><use href="#icon-forward"></use></svg>
                </button>
              </div>

              <div class="timeline-wrap">
                <div class="times"><span>1:42</span><span>-2:30</span></div>
                <input class="range red" aria-label="Posición de la canción" type="range" min="0" max="252" value="102" />
              </div>

              <div class="volume">
                <svg aria-hidden="true"><use href="#icon-volume"></use></svg>
                <input class="range compact" aria-label="Volumen" type="range" min="0" max="100" value="72" />
                <span>72</span>
              </div>
            </div>
          </article>
        </div>

        <aside class="queue-panel">
          <div class="queue-header">
            <div>
              <p class="eyebrow">A CONTINUACIÓN</p>
              <h2>Tu lista</h2>
            </div>
            <label class="sort-control">
              <span>ORDENAR</span>
              <select>
                <option>Añadidas</option>
                <option>Título</option>
                <option>Artista</option>
                <option>Duración</option>
              </select>
            </label>
          </div>

          <div class="queue-list">
            <button class="queue-item selected" type="button">
              <span class="queue-number">01</span>
              <img src="https://images.unsplash.com/photo-1761882725885-d3d8bd2032d1?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong>Midnight Drive</strong><small>Nova Reyes · After Hours</small></span>
              <span class="duration">4:12</span>
            </button>
            <button class="queue-item" type="button">
              <span class="queue-number">02</span>
              <img src="https://images.unsplash.com/photo-1632478179654-0b8a89119fc5?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong class="editor-white">Velvet Static</strong><small class="editor-white">The Night Tapes · Frequency</small></span>
              <span class="duration">3:38</span>
            </button>
            <button class="queue-item" type="button">
              <span class="queue-number">03</span>
              <img src="https://images.unsplash.com/photo-1677246791361-9b76619c1f90?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong class="editor-white">Slow Motion</strong><small class="editor-white">Elena Sol · Bloom</small></span>
              <span class="duration">3:14</span>
            </button>
            <button class="queue-item" type="button">
              <span class="queue-number">04</span>
              <img src="https://images.unsplash.com/photo-1761882738571-6cf4f77f9b65?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong class="editor-white">No Signal</strong><small class="editor-white">Milo Grey · Fault Lines</small></span>
              <span class="duration">4:33</span>
            </button>
            <button class="queue-item" type="button">
              <span class="queue-number">05</span>
              <img src="https://images.unsplash.com/photo-1556296569-44d434fb28d6?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong class="editor-white">Everything Glows</strong><small class="editor-white">Orion Club · Neon Weather</small></span>
              <span class="duration">3:51</span>
            </button>
            <button class="queue-item" type="button">
              <span class="queue-number">06</span>
              <img src="https://images.unsplash.com/photo-1545682113-be24ae6223d7?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong class="editor-white">Blue Room</strong><small class="editor-white">Juno Parks · Low Light</small></span>
              <span class="duration">3:25</span>
            </button>
            <button class="queue-item" type="button">
              <span class="queue-number">07</span>
              <img src="https://images.unsplash.com/photo-1632478179640-a7f5a9b1a555?auto=format&fit=crop&w=160&q=80" alt="" />
              <span class="queue-meta"><strong>Parallel Lines</strong><small>Cedar Lane · In Transit</small></span>
              <span class="duration">4:06</span>
            </button>
          </div>
          <div class="queue-footer">7 CANCIONES · 27 MIN</div>
        </aside>
      </section>

      <section class="sound-panel">
        <div class="sound-title">
          <span class="equalizer-icon">
            <svg aria-hidden="true"><use href="#icon-equalizer"></use></svg>
          </span>
          <div>
            <p class="eyebrow">SONIDO</p>
            <h2>Ecualizador</h2>
          </div>
          <span class="preset">PRESET&nbsp;&nbsp; Personalizado</span>
        </div>

        <div class="visualizer" aria-label="Visualización del ecualizador">
          <i style="--height: 31%"></i><i style="--height: 50%"></i><i style="--height: 69%"></i>
          <i style="--height: 88%"></i><i style="--height: 35%"></i><i style="--height: 54%"></i>
          <i style="--height: 73%"></i><i style="--height: 20%"></i><i style="--height: 39%"></i>
          <i style="--height: 58%"></i><i style="--height: 77%"></i><i style="--height: 24%"></i>
          <i style="--height: 43%"></i><i style="--height: 62%"></i><i style="--height: 81%"></i>
          <i style="--height: 28%"></i><i style="--height: 47%"></i><i style="--height: 66%"></i>
          <i style="--height: 85%"></i><i style="--height: 32%"></i><i style="--height: 51%"></i>
          <i style="--height: 70%"></i><i style="--height: 89%"></i><i style="--height: 36%"></i>
          <i style="--height: 55%"></i><i style="--height: 74%"></i><i style="--height: 21%"></i>
          <i style="--height: 40%"></i><i style="--height: 59%"></i><i style="--height: 78%"></i>
          <i style="--height: 25%"></i><i style="--height: 44%"></i><i style="--height: 63%"></i>
          <i style="--height: 82%"></i><i style="--height: 29%"></i><i style="--height: 48%"></i>
          <i style="--height: 67%"></i><i style="--height: 86%"></i>
        </div>

        <div class="tone-controls">
          <label class="tone">
            <span><b>GRAVES</b><small>80 HZ</small></span>
            <input class="range tone-range bass-range" type="range" min="0" max="100" value="60" />
            <output>+2 dB</output>
          </label>
          <label class="tone">
            <span><b>PRESENCIA</b><small>1 KHZ</small></span>
            <input class="range tone-range presence-range" type="range" min="0" max="100" value="45" />
            <output>-1 dB</output>
          </label>
          <label class="tone">
            <span><b>AGUDOS</b><small>12 KHZ</small></span>
            <input class="range tone-range treble-range" type="range" min="0" max="100" value="68" />
            <output>+4 dB</output>
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
